name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# Everything the tests need is built by them from source: a test program of
# this repository's on the Uzebox kernel (tests/testprog), which reads every
# control into its memory, and the Uzebox repository's own games and demos,
# with the AVR compiler. Upstream's own uzem is built too, with SDL, to
# compare pictures and sound with. So every test runs here, as before a push:
#   - uzem's source is the pinned commit with the patch applied, and the
#     package declares the controls the core has, with key names Chimera
#     knows;
#   - every control reaches the program, lag frames, the sound, the EEPROM,
#     the random seed, and the sandboxed core gives the native build's
#     results with savestates;
#   - each of the Uzebox's games runs, in the sandbox as natively, and a
#     game of each kind of video draws and sounds as upstream's uzem does;
#   - the package runs the test program and a demo in Chimera's headless
#     runner and in its window;
#   - Chimera's own checks of the package pass.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 06:20 UTC. A nightly is published only when main moved since the last
    # one; the shared publishing workflow checks.
    - cron: '20 6 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other, and the publishing that depends on
# the cancelled run is skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (native against sandbox, the package, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # The lib*-dev packages but SDL's are what Chimera's own build needs;
        # this core links none of them. gcc-avr, binutils-avr and avr-libc
        # build the Uzebox programs the tests run; libsdl2-dev builds
        # upstream's uzem, which the tests compare with.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 curl xz-utils patch libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev gcc-avr binutils-avr avr-libc libsdl2-dev

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Lay the patch over uzem
        run: sh ./waterbox/apply-patches.sh

      - name: Build the native reference and the sandbox runner
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the sandboxed core and the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: sh ./waterbox/build-package.sh -r "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Run the test script
        # A run in which these did not pass has tested nothing, so they are
        # asked for by name.
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          rc=0
          bash ./waterbox/run-gate.sh > gate.out 2>&1 || rc=$?
          cat gate.out
          [ "$rc" -eq 0 ]
          for t in source:patched package:fresh package:controls package:key-names uze:runs uze:hex-and-uze \
                   uze:gamepads uze:opposites uze:mouse uze:p1-controller uze:keyboard uze:keyboard-shift uze:power \
                   uze:random-seed uze:lag uze:sound uze:save-data uze:sandbox uze:presses-change-the-run \
                   uze:state-every-frame uze:state-other-box uze:state-rewind uze:sandbox-mouse \
                   refused:no-game refused:not-a-game refused:bad-uze stops:invalid \
                   game:Arkanoid game:BcDash game:DonkeyKong game:Megatris game:SuperMarioDemo game:Whack-a-Mole \
                   upstream:testprog upstream:BcDash upstream:Megatris upstream:SpriteDemo upstream:SuperMarioDemo \
                   upstream:Whack-a-Mole upstream:chess4uzebox upstream:VectorDemo upstream:BitmapDemo upstream:Mode9Demo \
                   upstream:MegaSokoban upstream:Mode13ExtendedDemo upstream:DonkeyKong engine:uze; do
            grep -q "^$t  *PASS " gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Run the window test
        # The package loaded by Chimera's own window (run headless,
        # with no display): the test program's memory against the headless
        # runner's, the keys, and Super Mario Demo.
        run: |
          rc=0
          bash ./tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout" > window.out 2>&1 || rc=$?
          cat window.out
          [ "$rc" -eq 0 ]
          for t in window:uze window:keys window:demo; do
            grep -q "^$t  *PASS " window.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Chimera's checks of the package
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: chimera-checkout/build/meson-linux/source/ui/test-packages

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: uzem-${{ github.sha }}
          path: chimera-checkout/build/Cores/uzem.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            gate.out
            window.out

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: uzem
      artifact: uzem-${{ github.sha }}
      package: uzem.chimeraCore
      kind: ${{ github.event.inputs.kind }}
